name: Build profile

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 0 * * *'  # every day at midnight UTC
  workflow_dispatch:

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Restore cover cache from output branch
        run: |
          curl -fsSL -o anime-covers.json \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/output/anime-covers.json" \
            || echo '{}' > anime-covers.json

      # build.js re-themes this snake and wraps it in a window
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: snk/snake.svg

      - name: Render cards and README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: node build.js

      - name: Publish cards to output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf output-branch
          git clone --depth 1 --branch output \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output-branch
          cp dist/*.svg anime-covers.json output-branch/
          cd output-branch
          git config user.name "GitHub Actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A .
          if git diff --cached --quiet; then
            echo "No card changes to publish"
            exit 0
          fi
          git commit -m "Update profile cards"
          git push origin output

      - name: Commit README
        run: |
          git config user.name "GitHub Actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README is up to date"
            exit 0
          fi
          git commit -m "Update profile README"
          git pull --rebase origin master
          git push origin master
