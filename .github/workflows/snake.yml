name: generate animation

on:
  # run automatically every 24 hours
  schedule:
    - cron: "0 */24 * * *"

  # allows to manually run the job at any time
  workflow_dispatch:

  # run on every push on the master branch
  push:
    branches:
    - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # generates a snake game from a github user (<github_user_name>) contributions graph, output a svg animation at <svg_out_path>
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # push the generated files to the output branch without wiping the other
      # files that live there, such as the anime cover artwork
      - name: push github-contribution-grid-snake.svg to the output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            rm -rf output-branch
            git clone --branch output \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output-branch
            cp dist/*.svg output-branch/
            cd output-branch
            git config user.name "GitHub Actions"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add ./*.svg
            if git diff --cached --quiet; then
              echo "No snake changes to publish"
              exit 0
            fi
            git commit -m "Update contribution snake"
            if git push origin output; then
              exit 0
            fi
            echo "Push rejected, the other workflow got there first - retrying on a fresh clone"
            cd ..
            sleep 5
          done
          echo "Could not publish the snake after 3 attempts"
          exit 1
