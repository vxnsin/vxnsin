name: cozy-readme

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['cozy.config.json', '.github/workflows/cozy-readme.yml']

permissions:
  contents: write

jobs:
  cozy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vxnsin/cozy-readme@v1
